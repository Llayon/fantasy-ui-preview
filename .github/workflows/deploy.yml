name: Publish Fantasy U2 preview
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing preview release with site.zip and SHA256SUMS
        type: string
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the reviewed static build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/fantasy-preview"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern site.zip --pattern SHA256SUMS --dir "$RUNNER_TEMP/fantasy-preview"
          cd "$RUNNER_TEMP/fantasy-preview"
          sha256sum --check SHA256SUMS
      - name: Verify and unpack only the static site
        working-directory: ${{ runner.temp }}/fantasy-preview
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,stat,zipfile
          target=pathlib.Path('site')
          with zipfile.ZipFile('site.zip') as z:
              assert len(z.infolist())<2000 and sum(i.file_size for i in z.infolist())<50_000_000
              for info in z.infolist():
                  name=pathlib.PurePosixPath(info.filename)
                  assert not name.is_absolute() and '..' not in name.parts and '\\' not in info.filename
                  assert not stat.S_ISLNK(info.external_attr>>16)
                  path=target.joinpath(*name.parts)
                  if info.is_dir():
                      path.mkdir(parents=True,exist_ok=True)
                  else:
                      path.parent.mkdir(parents=True,exist_ok=True)
                      path.write_bytes(z.read(info))
          manifest=json.loads((target/'build.json').read_text())
          for f in manifest['files']:
              data=(target/f['path']).read_bytes()
              assert len(data)==f['bytes'] and hashlib.sha256(data).hexdigest()==f['sha256'],f['path']
          actual={str(p.relative_to(target)) for p in target.rglob('*') if p.is_file()}
          assert actual=={'build.json',*(f['path'] for f in manifest['files'])}
          print('Verified',len(actual),'static files for Fantasy U2',manifest['version'])
          PY
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload the static site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/fantasy-preview/site
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
